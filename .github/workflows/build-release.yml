name: 构建中文版 release APK

on:
  workflow_dispatch:  # 手动触发: Actions 页面点 Run workflow
  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.31.6"

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 构建 release APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease -x lint --console=plain

      - name: 签名 APK
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.keystore
          BT="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED=$(find app/build/outputs/apk/release -name "*-unsigned.apk" | head -1)
          echo "待签名: $UNSIGNED"
          "$BT/zipalign" -f 4 "$UNSIGNED" /tmp/aligned.apk
          "$BT/apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-key-alias jcode \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --out JCode-中文版-release.apk /tmp/aligned.apk
          "$BT/apksigner" verify --print-certs JCode-中文版-release.apk
          rm -f /tmp/release.keystore /tmp/aligned.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: JCode-中文版-release
          path: JCode-中文版-release.apk
          if-no-files-found: error
